[project]
name = "netanazar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "trafilatura>=1.12", "feedparser>=6.0", "apscheduler>=3.10", "python-dotenv>=1.0", "flask>=3.0"]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
