<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NetaNazar · Know your MP</title>
<meta name="description" content="Search any MP or MLA: attendance, positions held, and the days they were in the news.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("nn_theme")||"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#/"><span class="mark" id="mark"></span><span>NetaNazar</span></a>
  <div id="topSearch" hidden style="flex:1;max-width:520px;margin-left:12px"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme" title="Light / dark"><span id="themeIc"></span></button>
</div></header>

<main id="view"></main>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-label="Story details"><div class="sheet" id="sheet"></div></div>

<footer><div class="wrap"><span>Members, parties, seats and attendance come from the official Lok Sabha and Rajya Sabha records (sansad.in). Stories are matched to members by name from public news feeds, so a match can occasionally be wrong.</span></div></footer>

<script src="icons.js"></script>
<script>document.getElementById('mark').innerHTML=ic('eye');document.getElementById('themeIc').innerHTML=ic('sun');</script>
<script src="site.js"></script>
</body>
</html>
